<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Acupuncture · 模型证据图</title>
<style>
:root{--bg:#0b1016;--panel:#121b26;--line:#2b3b4c;--text:#e3edf5;--muted:#9aacbe;--cyan:#79dfd5;--pink:#efa5b0;--amber:#eac27c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,select{font:inherit;color:var(--text);background:#1b2734;border:1px solid var(--line);border-radius:6px;padding:7px 11px}button{cursor:pointer}button:hover,select:hover{border-color:#92a8bd}a{color:var(--cyan);text-underline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.3px}h2{font-size:17px}h3{font-size:14px}header{padding:22px 26px 16px;border-bottom:1px solid var(--line)}.top{display:flex;gap:18px;justify-content:space-between;align-items:center}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:2px;color:var(--cyan);margin-bottom:5px}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:16px}.mode-buttons{display:flex;gap:5px;margin-right:14px}.mode-buttons button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan);background:#17302f}label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}select{font-size:12px;max-width:310px}.badge{padding:3px 8px;border:1px solid var(--line);border-radius:20px;font-size:11px;white-space:nowrap}.workspace{display:grid;grid-template-columns:minmax(600px,1fr) 350px;gap:0;max-width:1600px;margin:auto}.canvas-panel{padding:18px 22px 12px;border-right:1px solid var(--line);min-width:0}.graph-head{display:flex;justify-content:space-between;gap:20px;margin-bottom:9px}.graph-head p{margin-top:3px}.graph{width:100%;display:block;background:radial-gradient(ellipse at 50% 40%,#131e2b 0%,#0d141c 70%);border:1px solid #1f2d3d;border-radius:8px}.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);margin:10px 0}.swatch{display:inline-block;width:13px;height:9px;background:#25313f;margin-right:5px;vertical-align:middle}.gradient{width:120px;height:8px;background:linear-gradient(90deg,#a24d62,#263443,#379b93);display:inline-block;vertical-align:middle;margin:0 6px}.sidebar{padding:20px 18px}.side-card{padding:16px 0;border-bottom:1px solid var(--line)}.side-card:first-child{padding-top:0}.side-card h3{margin-bottom:8px}.side-card p+p{margin-top:7px}.notice{font-size:12px;color:#d4c09d;background:#251f17;border-left:2px solid var(--amber);padding:10px 12px;margin-top:12px}.source-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px}.stat{font-size:28px;font-weight:600}.mini-row{display:grid;grid-template-columns:92px 1fr 58px;gap:8px;align-items:center;margin:9px 0;font-size:11px}.track{height:7px;background:#25313f;position:relative;border-radius:2px}.fill{position:absolute;height:7px;border-radius:2px}.num{text-align:right;font-variant-numeric:tabular-nums}.comparison{display:grid;grid-template-columns:1fr 52px 52px;gap:4px;font-size:11px;border-bottom:1px solid #233141;padding:7px 0}.yes{color:var(--cyan)}.no{color:var(--muted)}.selected-meta{color:var(--cyan)}.question{font-size:11px;white-space:pre-wrap;max-height:150px;overflow:auto;color:var(--muted)}details summary{cursor:pointer;color:var(--muted);font-size:12px}footer{padding:10px 26px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}[hidden]{display:none!important}.svg-text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:var(--text)}.svg-mono{font-family:ui-monospace,monospace;fill:var(--text)}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect{stroke:#fff;stroke-width:2}.candidate-button{cursor:pointer;outline:none}.candidate-button:hover rect,.candidate-button:focus-visible rect{stroke:#fff;stroke-width:2}.native:hover rect,.native:focus rect{stroke:#fff;stroke-width:2}.error{color:#efa5b0;padding:35px}:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}@media(max-width:1050px){.workspace{grid-template-columns:minmax(480px,1fr) 310px}.canvas-panel{padding:16px 12px}.sidebar{padding:16px 12px}.top{align-items:start}}@media(max-width:800px){header{padding:16px}.workspace{display:block}.canvas-panel{border-right:0}.sidebar{border-top:1px solid var(--line);padding:20px}.graph{min-width:550px}.graph-scroll{overflow:auto}.top{flex-wrap:wrap}.controls{gap:8px}select{max-width:260px}.mode-buttons{width:100%}}

.workspace.survey-mode{grid-template-columns:minmax(500px,1fr) minmax(410px,560px)}
.survey-mode .sidebar{padding:18px 16px}.survey-mode .graph{min-width:500px}.survey-navigation{display:flex;gap:5px;align-items:end}.survey-navigation button{font-size:12px}
.answer-grid,.dose-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;align-items:start}.answer-card{padding:12px;background:#101923;border:1px solid #2b3b4c;border-radius:7px;min-width:0}.answer-card.intervened{border-color:#679b99}.answer-card h3{margin-bottom:5px}.answer-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.75;margin-top:10px}.answer-card pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.5;max-height:240px;overflow:auto}.answer-card details{margin-top:10px}.answer-card .source-links{margin-top:8px}.survey-prompt{white-space:pre-wrap;overflow-wrap:anywhere;color:#bccbd9;font-size:12px;margin-top:8px}.dose-list{margin-top:18px}.dose-list>summary{font-size:13px;color:var(--cyan)}.survey-dose-buttons{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.survey-dose-buttons button{font-size:11px;padding:4px 8px}.survey-dose-buttons button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}button:disabled{opacity:.4;cursor:default}.survey-mode .notice{margin-top:10px}
@media(max-width:1050px){.workspace.survey-mode{grid-template-columns:minmax(480px,1fr) 400px}.survey-mode .sidebar{padding:15px 12px}}@media(max-width:900px){.workspace.survey-mode{display:block}.survey-mode .sidebar{border-top:1px solid var(--line)}.survey-mode .graph{min-width:500px}.survey-mode .canvas-panel{border-right:0}}

@media(max-width:900px){
  body:has(.workspace.survey-mode) header{padding:11px 14px 9px}
  body:has(.workspace.survey-mode) h1{font-size:19px}
  body:has(.workspace.survey-mode) .eyebrow{margin-bottom:2px}
  body:has(.workspace.survey-mode) .controls{margin-top:9px;gap:7px}
  body:has(.workspace.survey-mode) .top{gap:7px}
  body:has(.workspace.survey-mode) .mode-buttons{margin-right:0}
  .survey-mode .canvas-panel{padding:10px 12px 7px}
  .survey-mode .graph-head{margin-bottom:6px;gap:8px}
  .survey-mode .graph-head h2{font-size:15px}
  .survey-mode .graph-head p{font-size:11px;line-height:1.4}
  .survey-mode .graph-scroll{max-height:220px;overflow:auto;overscroll-behavior:contain}
  .survey-mode .legend{margin:6px 0;gap:5px 10px;font-size:10px}
  .survey-mode #graph-note{font-size:10px;line-height:1.4}
  .survey-mode .sidebar{padding:12px 14px}
  .survey-mode .side-card{padding-bottom:10px}
  .survey-mode .answer-grid{margin-top:8px}
}
</style>
</head>
<body>
<header><div class="top"><div><div class="eyebrow">ACUPUNCTURE / MODEL MAP</div><h1>在模型图上寻找可检验的线索</h1></div><div class="small"><span class="badge">已有证据 · 只读</span>　<a href="index.html">完整证据详情 ↗</a></div></div>
<div class="controls"><div class="mode-buttons"><button data-mode="survey" aria-pressed="true">全层调查 · 回答对照</button><button data-mode="root" aria-pressed="false">4B 组件地图</button><button data-mode="transfer" aria-pressed="false">三模型迁移图</button></div><div id="survey-controls" style="display:contents"><label>模型<select id="survey-model"><option value="2b">Qwen3.5-2B · 24层</option><option value="4b" selected>Qwen3.5-4B · 32层</option><option value="9b">Qwen3.5-9B · 32层</option></select></label><label>题目<select id="survey-question"></select></label><label>地图与回答剂量<select id="survey-dose"><option value="1">+1 · 每层十点</option><option value="0.0625">+1/16 · 每层一点</option><option value="0.125">+1/8 · 每层一点</option><option value="0.25">+1/4 · 每层一点</option><option value="0.5" selected>+1/2 · 每层一点</option></select></label><div class="survey-navigation"><button id="survey-prev" aria-label="上一层">↑ 上一层</button><button id="survey-next" aria-label="下一层">↓ 下一层</button></div></div><div id="root-controls" style="display:contents" hidden><label>任务<select id="task"><option value="mmlu">MMLU · 开发 32 题</option><option value="arc_challenge">ARC-Challenge · 开发 32 题</option></select></label><label>题目<select id="item"></select></label><label>观察位置<select id="position"><option value="prompt_last">提示最后一个 token</option><option value="answer_tail">答案续接尾部</option></select></label><label>已实测候选<select id="candidate"><option value="">点击图中组件</option></select></label><label style="flex-direction:row;align-items:center;padding-bottom:8px"><input id="expand-layers" type="checkbox">展开未测层</label></div><div id="transfer-controls" hidden><label>迁移的源通道组<select id="group"><option value="true">真实两针</option><option value="random1">随机源 1</option><option value="random2">随机源 2</option><option value="random3">随机源 3</option></select></label></div></div></header>
<div id="loading" class="error">正在读取本地已有证据，不调用模型。</div>
<main id="workspace" class="workspace" hidden><section class="canvas-panel"><div class="graph-head"><div><h2 id="graph-title"></h2><p id="graph-subtitle" class="small muted"></p></div><span id="graph-count" class="badge"></span></div><div class="graph-scroll"><svg id="graph" class="graph" viewBox="0 0 820 740" aria-label="模型证据图"></svg></div><div id="legend" class="legend"></div><p id="graph-note" class="small muted"></p></section><aside id="sidebar" class="sidebar" aria-live="polite"></aside></main>
<footer><span id="build"></span> · 梯度预测、实测修复和几何映射是不同证据。<a href="index.html">逐题记录与完整对照</a></footer>
<script>
'use strict';
const $=id=>document.getElementById(id), finite=v=>typeof v==='number'&&Number.isFinite(v);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,n=3)=>finite(v)?v.toFixed(n):'—', pct=v=>finite(v)?(v*100).toFixed(2)+'%':'—', sign=v=>v>0?'+':v<0?'−':'0';
const conds=['clean','AB_d1','repair','control_repair','replay','control_replay'];
const labels={clean:'clean 无针',AB_d1:'AB 两针',repair:'局部修复',control_repair:'匹配修复对照',replay:'反向重现',control_replay:'匹配重现对照'};
const palette={clean:'#a0b1c4',AB_d1:'#eac27c',repair:'#79dfd5',control_repair:'#87b3eb',replay:'#efa5b0',control_replay:'#bca2e3'};
let data,surveyData,mode='survey',selected='L23.attention',selectedMapping='2b:13',surveyLayer=6,surveyChannel=7840;
function source(ref,label='原始证据'){const s=data.sources[ref?.path];return s?.status==='available'&&s.href==='/' + s.path&&s.href.startsWith('/experiments/')?`<a href="${esc(s.href)}" target="_blank" rel="noopener" title="${esc(ref.pointer||'')}">${esc(label)} ↗</a>`:'<span class="muted">来源未提供</span>';}
function explorer(model,layer,index){const url=new URL(location.href);url.port=({"2b":8792,"4b":8794,"9b":8799})[model];url.pathname='/';url.search='';url.hash=`L${layer}/N${index}`;return url.href;}
function linkNode(model,layer,index,label,x,y,width=110,color='#eac27c',height=18){return `<a class="native" href="${esc(explorer(model,layer,index))}" target="_blank" rel="noopener" aria-label="在原Explorer打开${esc(label)}"><rect x="${x}" y="${y}" width="${width}" height="${height}" rx="4" fill="#17232e" stroke="${color}"/><text x="${x+width/2}" y="${y+height/2+3.5}" text-anchor="middle" class="svg-mono" font-size="10.5" style="fill:${color}">${esc(label)}</text><title>点击在 ${model.toUpperCase()} 原 Explorer 打开 L${layer}/N${index}</title></a>`;}
function candidates(){return data.root_cause.candidates;}
function currentItem(){return data.root_cause.ranking.items.find(r=>r.id===$('item').value);}
function selectedCandidate(){return candidates().find(c=>c.id===$('candidate').value);}
function setItems(){const old=$('item').value;const list=data.root_cause.ranking.items.filter(r=>r.benchmark===$('task').value);$('item').innerHTML=list.map(r=>`<option value="${esc(r.id)}">${esc(r.id)}</option>`).join('');if(list.some(r=>r.id===old))$('item').value=old;}
function color(value,max){if(!finite(value))return '#25313f';const f=Math.min(1,Math.abs(value)/max);const base=[38,52,67],end=value>=0?[55,155,147]:[162,77,98];return `rgb(${base.map((v,i)=>Math.round(v+(end[i]-v)*f)).join(',')})`;}
function renderRoot(){
  const item=currentItem(),position=$('position').value,rows=item.ranking.filter(r=>r.positions===position),lookup=Object.fromEntries(rows.map(r=>[r.component,r]));
  const max=Math.max(...rows.map(r=>Math.abs(r.predicted_repair)),0.001),step=19,top=54,expanded=$('expand-layers').checked,firstLayer=expanded?0:13,height=top+(expanded?32:20)*step+30;
  $('graph').setAttribute('viewBox',`0 0 820 ${height}`);
  $('graph-title').textContent='Qwen3.5-4B · 32 层组件地图';$('graph-subtitle').textContent='点击组件看预测；点击 C01–C10 看六条件实测。两针在 MLP 内部的指定通道。';$('graph-count').textContent=`${rows.length} / 64 个组件有当前读数`;
  let svg='<text x="66" y="29" class="svg-text" font-size="11" style="fill:#9aacbe">层号 · 从输入到输出</text><text x="269" y="29" text-anchor="middle" class="svg-text" font-size="15">Attention 组件</text><text x="569" y="29" text-anchor="middle" class="svg-text" font-size="15">MLP 组件</text><text x="269" y="48" text-anchor="middle" class="svg-text" font-size="10" style="fill:#9aacbe">组件输出贡献；不等同于注意力权重</text><text x="569" y="48" text-anchor="middle" class="svg-text" font-size="10" style="fill:#9aacbe">组件输出贡献；不等同于单个神经元</text>';
  if(!expanded)svg+=`<rect x="128" y="${top}" width="582" height="17" rx="3" fill="#1c2835" stroke="#344456"/><text x="419" y="${top+12}" text-anchor="middle" class="svg-text" font-size="10.5" style="fill:#9aacbe">L0–L12 · 13 个未测层已折叠；勾选“展开未测层”查看</text>`;
  for(let layer=firstLayer;layer<32;layer++){
    const y=top+(expanded?layer:layer-12)*step;svg+=`<text x="94" y="${y+13}" text-anchor="end" class="svg-mono" font-size="11" style="fill:#9aacbe">L${layer}</text>`;
    for(const [component,x] of [['attention',128],['mlp',428]]){
      const id=`L${layer}.${component}`,row=lookup[id],isSelected=selected===id;
      svg+=`<g class="node" role="button" tabindex="0" data-component="${id}" aria-label="${id}，${row?'梯度修复预测'+fmt(row.predicted_repair):'当前位置未测'}"><rect x="${x}" y="${y}" width="282" height="17" rx="3" fill="${color(row?.predicted_repair,max)}" stroke="${isSelected?'#fff':'#344456'}" stroke-width="${isSelected?2:0.5}"/><text x="${x+10}" y="${y+12}" class="svg-mono" font-size="10.5">${row?fmt(row.predicted_repair):'未测'}</text><title>${id} · ${position}\n${row?'predicted_repair = '+row.predicted_repair+'；有效位置计数 '+row.active_position_count:'没有该题、该位置的排名记录'}</title></g>`;
      const matches=candidates().filter(c=>c.component===id);
      matches.forEach((c,i)=>{const cx=x+225-i*49,active=c.id===$('candidate').value;svg+=`<g class="candidate-button" role="button" tabindex="0" data-candidate="${c.id}" aria-label="${c.id} ${c.positions}"><rect x="${cx}" y="${y+1}" width="44" height="15" rx="3" fill="${active?'#d5eeeb':'#101923'}" stroke="${c.positions===position?'#79dfd5':'#708298'}" stroke-dasharray="${c.positions===position?'none':'2 2'}"/><text x="${cx+22}" y="${y+12}" text-anchor="middle" class="svg-mono" font-size="10" style="fill:${active?'#102522':'#dceaf5'}">${c.id}</text><title>${c.id} · ${c.positions} · 点击切换到此候选的实际观察位置</title></g>`;});
      const needle=Object.entries(data.root_cause.needles).find(([,v])=>v.layer===layer);
      if(component==='mlp'&&needle)svg+=linkNode('4b',layer,needle[1].channel,`${needle[0]} N${needle[1].channel}${sign(needle[1].sign)}`,x+89,y,119);
    }
  }
  svg+=`<text x="410" y="${height-12}" text-anchor="middle" class="svg-text" font-size="11" style="fill:#9aacbe">不绘制未观测的因果传播连边 · 白色边框表示当前选择</text>`;$('graph').innerHTML=svg;
  $('legend').innerHTML=`<span>梯度修复预测</span><span>−${fmt(max)} <i class="gradient"></i> +${fmt(max)}</span><span><i class="swatch"></i>未测</span><span>实线候选：当前位置 · 虚线候选：另一位置，点击切换</span>`;
  $('graph-note').textContent='颜色来自该题的 predicted_repair（一阶梯度修复预测），不是激活强度或因果通路。色标按当前题缩放；跨题颜色不可直接比较。';
  renderRootSide(lookup[selected]);
}
function miniBars(values,isAccuracy){const nums=values.map(r=>r.value).filter(finite),min=isAccuracy?0:Math.min(0,...nums),max=isAccuracy?100:Math.max(0,...nums),span=max-min||1,zero=-min/span*100;return values.map(r=>{const p=finite(r.value)?(r.value-min)/span*100:zero;return `<div class="mini-row"><span>${labels[r.key]}</span><div class="track"><div class="fill" style="left:${Math.min(p,zero)}%;width:${Math.abs(p-zero)}%;background:${palette[r.key]}"></div></div><span class="num">${fmt(r.value,isAccuracy?1:3)}${isAccuracy?'%':''}</span></div>`;}).join('');}
function renderRootSide(row){
  const item=currentItem(),candidate=selectedCandidate();let html=`<div class="side-card"><p class="small selected-meta">当前选择</p><h2 class="mono">${esc(selected)}</h2><p class="muted small">${$('position').value==='prompt_last'?'共同提示最后一个 token':'答案续接尾部'}</p><div class="stat">${fmt(row?.predicted_repair)}</div><p class="small muted">${row?'当前题的一阶修复预测；仅用于筛查':'当前题、该位置没有预测记录；不等同于零效应'}</p><div class="source-links">${source(item.ref,'排名原文')}</div></div>`;
  if(candidate){const stats=candidate.tasks[$('task').value],actual=candidate.items.find(i=>i.id===item.id),n=candidate.items.filter(i=>i.benchmark===$('task').value).length;
    html+=`<div class="side-card"><h3>${esc(candidate.id)} · 实测六条件</h3><p class="small muted">当前题 margin：正确选项分数 − 最强错误选项分数</p>${miniBars(conds.map(key=>({key,value:actual?.conditions[key]?.margin})),false)}<div class="source-links">${source(actual?.ref,'当前题六条件原文')}${source(candidate.ref,'候选归档')}</div></div><div class="side-card"><h3>该任务 ${n} 题 · 正确率</h3>${miniBars(conds.map(key=>({key,value:stats.correct_counts[key]/n*100})),true)}</div>`;
    const pairs=[['repair_vs_AB','修复 − AB'],['repair_vs_matched_control','修复 − 匹配对照'],['replay_damage_vs_clean','clean − 反向重现'],['replay_damage_vs_matched_control','匹配对照 − 重现']];
    html+=`<div class="side-card"><h3>四项开发比较</h3><p class="small muted">“通过”仅指该 95% 区间下界大于 0</p><div class="comparison muted"><span>比较</span><span>正确率</span><span>margin</span></div>${pairs.map(([key,label])=>`<div class="comparison"><span>${label}</span>${['correct','margin'].map(metric=>{const v=stats.comparisons[key][metric],yes=v.ci95[0]>0;return `<span class="${yes?'yes':'no'}" title="效应 ${v.effect}；95%区间 [${v.ci95.join(', ')}]">${yes?'通过':'未通过'}</span>`;}).join('')}</div>`).join('')}<div class="source-links">${source(candidate.tasks_ref,'配对区间原文')}</div></div>`;
    if(candidate.metadata.active_question_count?.[$('task').value]===0)html+='<div class="notice">该任务的此观察位置为空。零变化不能证明该组件没有作用。</div>';
  }else html+='<div class="side-card"><h3>该位置没有六条件实测</h3><p class="small muted">请点击图中的 C01–C10 标签查看实测修复与反向重现；不把排名预测填成实测效应。</p></div>';
  const q=data.root_cause.questions?.find(q=>q.id===item.id);if(q)html+=`<details class="side-card"><summary>当前题目</summary><p class="question">${esc(q.doc?.question||q.context)}</p></details>`;

function renderTransfer(){
  const group=$('group').value,positions={'2b':75,'4b':324,'9b':573},width=172,top=50,step=14,sourceSigns=Object.fromEntries(Object.values(data.root_cause.needles).map(n=>[n.layer,n.sign]));

  }

    for(let layer=0;layer<layers;layer++){
      const y=top+layer*step;svg+=`<rect x="${x}" y="${y}" width="${width}" height="12" rx="3" fill="#1c2835" stroke="#2b3b4c" stroke-width=".5"/><text x="${x+10}" y="${y+9.5}" class="svg-mono" font-size="10" style="fill:#91a3b6">L${layer}</text>`;
      if(layer===13||layer===14){const row=model==='4b'?byId['2b'].mapping.selection[group][layer]:byId[model].mapping.selection[group][layer],index=model==='4b'?row.source_index:row.index,s=model==='4b'?sourceSigns[layer]:row.sign,color=layer===13?'#79dfd5':'#bca2e3';svg+=linkNode(model,layer,index,`L${layer} · N${index} ${sign(s)}`,x,y,width,color,13);}
    }
    if(model==='2b')svg+='<text x="161" y="412" text-anchor="middle" class="svg-text" font-size="11" style="fill:#778b9e">模型在 L23 结束</text>';
  }
  svg+='<text x="410" y="518" text-anchor="middle" class="svg-text" font-size="11" style="fill:#9aacbe">虚线只表示已有映射记录，不是模型内部计算连边</text>';$('graph').innerHTML=svg;
  $('legend').innerHTML='<span><i class="swatch" style="background:#79dfd5"></i>L13 映射</span><span><i class="swatch" style="background:#bca2e3"></i>L14 映射</span><span>颜色仅区分两条记录；不能据此认定跨模型功能对应</span>';
  $('graph-note').textContent='线标签 = 映射向量被一个目标通道保留的平方范数比例。低保留率说明原生单通道只近似其中很小一部分；S_recipe 还使用独立配方尺度。';
  const [targetId,layer]=selectedMapping.split(':'),target=byId[targetId],row=target.mapping.selection[group][layer],fit=target.mapping.mapping[layer];

}
const doseLabels={'0.0625':'+1/16','0.125':'+1/8','0.25':'+1/4','0.5':'+1/2','1':'+1'};
const doseOrder=['0.0625','0.125','0.25','0.5','1'];
function surveyModel(){return surveyData.models.find(m=>m.id===$('survey-model').value);}
function surveyPoint(){return surveyModel().points.find(p=>p.layer===surveyLayer&&p.channel===surveyChannel);}
function answerState(r){return !r?'unmeasured':!r.text.trim()?'empty':r.stop_reason==='length_limit'?'limit':'eos';}
function answerColor(r){return {unmeasured:'#18212c',empty:'#684b62',limit:'#765d35',eos:'#285d63'}[answerState(r)];}
function answerStop(r){return r.stop_reason==='length_limit'?'达到 128 token 上限':r.stop_reason==='eos_token'?'自然结束':r.stop_reason;}
function answerLink(r){return typeof r.source==='string'&&r.source.startsWith('experiments/')&&!r.source.split('/').includes('..')?`<a href="/${esc(r.source)}" target="_blank" rel="noopener">原始记录 ↗</a>`:'';}
function answerCard(r,label,emphasize=false){
  if(!r)return `<article class="answer-card"><h3>${esc(label)}</h3><p class="small muted">此通道没有该剂量的记录。尚未测量，不代表没有变化。</p></article>`;
  return `<article class="answer-card ${emphasize?'intervened':''}"><h3>${esc(label)}</h3><p class="small muted">${r.tokens} tokens · ${esc(answerStop(r))}</p><div class="answer-text">${r.text.trim()?esc(r.text):'<span class="muted">空正文（原始标记见下方）</span>'}</div><details><summary>含特殊标记的原文</summary><pre>${esc(r.raw_text)}</pre></details><div class="source-links">${answerLink(r)}</div></article>`;
}
function surveyHash(){const params=new URLSearchParams({view:'survey',model:$('survey-model').value,layer:String(surveyLayer),channel:String(surveyChannel),question:$('survey-question').value,dose:$('survey-dose').value});history.replaceState(null,'','#'+params.toString());}
function renderSurvey(){
  const model=surveyModel(),q=$('survey-question').value,dose=$('survey-dose').value,point=surveyPoint(),question=surveyData.questions.find(r=>r.id===q),step=21,top=42,height=top+model.layers*step+23;
  $('graph').setAttribute('viewBox',`0 0 650 ${height}`);
  $('graph-title').textContent=`Qwen3.5-${model.id.toUpperCase()} · 全层单针回答`;
  $('graph-subtitle').textContent=`${question.id} ${question.label} · 当前剂量 ${doseLabels[dose]} · 点击通道，对照同一题的回答`;
  const available=model.points.filter(p=>p.doses[dose]).length;
  $('graph-count').textContent=`${available} / ${model.points.length} 点有当前剂量`;
  let svg='<text x="14" y="24" class="svg-text" font-size="12" style="fill:#9aacbe">层</text><text x="48" y="24" class="svg-text" font-size="12" style="fill:#9aacbe">每层十个实测通道 · 按编号排列</text>';
  for(let layer=0;layer<model.layers;layer++){
    const y=top+layer*step,points=model.points.filter(p=>p.layer===layer).sort((a,b)=>a.channel-b.channel);
    if(layer===surveyLayer)svg+=`<rect x="5" y="${y-2}" width="638" height="22" rx="4" fill="#243441"/>`;
    svg+=`<text x="38" y="${y+13}" text-anchor="end" class="svg-mono" font-size="12" style="fill:${layer===surveyLayer?'#fff':'#9aacbe'}">L${layer}</text>`;
    points.forEach((p,i)=>{const x=48+i*59,r=p.doses[dose]?.[q],active=p===point,hasDoses=Object.keys(p.doses).length>1,description=r?`${r.tokens} tokens，${answerState(r)==='empty'?'空正文，':''}${answerStop(r)}`:'当前剂量未测';
      svg+=`<g class="node survey-node" role="button" tabindex="0" data-survey-layer="${layer}" data-survey-channel="${p.channel}" aria-label="L${layer} N${p.channel}，${description}${hasDoses?'，有五档剂量':''}" aria-pressed="${active}"><rect x="${x}" y="${y}" width="55" height="18" rx="4" fill="${answerColor(r)}" stroke="${active?'#fff':hasDoses?'#eac27c':'#344456'}" stroke-width="${active?2.3:hasDoses?1.5:.6}"/><text x="${x+27.5}" y="${y+13}" text-anchor="middle" class="svg-mono" font-size="10.5" style="fill:${r?'#e3edf5':'#637589'}">${p.channel}</text>${hasDoses?`<circle cx="${x+50}" cy="${y+3}" r="2.1" fill="#eac27c"/>`:''}<title>L${layer}/N${p.channel} · ${question.id} · ${doseLabels[dose]}\n${description}\n${hasDoses?'此点已有完整五档剂量':'此点仅测过 +1'}</title></g>`;
    });
  }
  svg+=`<text x="325" y="${height-5}" text-anchor="middle" class="svg-text" font-size="11" style="fill:#9aacbe">从输入端 L0 到输出端 L${model.layers-1} · 同列不代表相同通道或功能</text>`;
  $('graph').innerHTML=svg;
  $('legend').innerHTML='<span><i class="swatch" style="background:#285d63"></i>有正文 · 自然结束</span><span><i class="swatch" style="background:#765d35"></i>有正文 · 达到128上限</span><span><i class="swatch" style="background:#684b62"></i>空正文</span><span><i class="swatch" style="background:#18212c;border:1px solid #344456"></i>当前剂量未测</span><span><i class="swatch" style="background:transparent;border:1.5px solid #eac27c"></i>五档点</span>';
  $('graph-note').textContent='颜色只表示回答是否展开及结束方式，不是正确率、损伤程度或功能分区。每层十点是抽样；低剂量只测过其中一点。';
  const r=point.doses[dose]?.[q],baseline=model.baseline[q],five=Object.keys(point.doses).length>1;
  $('sidebar').innerHTML=`<div class="side-card"><p class="small selected-meta">当前通道 · ${model.id.toUpperCase()}</p>
  <h2>L${point.layer} / N${point.channel} <span class="badge">${five?'已有五档剂量':'仅有 +1'}</span></h2>
  <p class="survey-prompt">${esc(question.prompt)}</p><div class="survey-dose-buttons">${doseOrder.filter(d=>point.doses[d]).map(d=>`<button data-answer-dose="${d}" aria-pressed="${dose===d}">${doseLabels[d]}</button>`).join('')}</div>
  ${!r?'<div class="notice">此点未测当前剂量。点击上方 +1 查看已有回答。</div>':''}</div>
  <div class="answer-grid">${answerCard(baseline,'原版 · 0')}${answerCard(r,'单针 · '+doseLabels[dose],true)}</div>
  ${five?`<details class="dose-list"><summary>展开原版与五档剂量 · 全部六栏</summary><div class="dose-grid">${answerCard(baseline,'原版 · 0')}${doseOrder.map(d=>answerCard(point.doses[d][q],doseLabels[d],d===dose)).join('')}</div></details>`:'<p class="small muted" style="margin-top:15px">五档剂量仅覆盖每层固定的一点；地图金色边框标出这些点。</p>'}
  <p class="small muted" style="margin-top:16px">单针、正向、最多128个新token。回答全文保留；自然结束不等于回答正确，达到上限也不自动等于错误。</p>`;
  $('survey-prev').disabled=surveyLayer===0;$('survey-next').disabled=surveyLayer===model.layers-1;
  surveyHash();
}
function changeSurveyLayer(delta){const model=surveyModel(),layer=Math.max(0,Math.min(model.layers-1,surveyLayer+delta)),points=model.points.filter(p=>p.layer===layer);const point=points.find(p=>Object.keys(p.doses).length>1)||points[0];surveyLayer=point.layer;surveyChannel=point.channel;renderSurvey();}
function initSurvey(){
  $('survey-question').innerHTML=surveyData.questions.map(q=>`<option value="${esc(q.id)}">${esc(q.id)} · ${esc(q.label)}</option>`).join('');$('survey-question').value='Q04';
  const params=new URLSearchParams(location.hash.slice(1));
  if(surveyData.models.some(m=>m.id===params.get('model')))$('survey-model').value=params.get('model');
  if(surveyData.questions.some(q=>q.id===params.get('question')))$('survey-question').value=params.get('question');
  if(doseOrder.includes(params.get('dose')))$('survey-dose').value=params.get('dose');
  const model=surveyModel(),point=model.points.find(p=>p.layer===Number(params.get('layer'))&&p.channel===Number(params.get('channel')))||model.points.find(p=>p.layer===surveyLayer&&p.channel===surveyChannel)||model.points.find(p=>p.layer===6&&Object.keys(p.doses).length>1)||model.points[0];
  surveyLayer=point.layer;surveyChannel=point.channel;
}
function render(){
  $('workspace').classList.toggle('survey-mode',mode==='survey');
  if(mode==='survey')renderSurvey();else if(mode==='root')renderRoot();else renderTransfer();
}
function selectCandidate(id){const c=candidates().find(c=>c.id===id);$('candidate').value=id;if(c){selected=c.component;$('position').value=c.positions;}renderRoot();}
function graphAction(event){const survey=event.target.closest('[data-survey-channel]');if(survey){surveyLayer=Number(survey.dataset.surveyLayer);surveyChannel=Number(survey.dataset.surveyChannel);renderSurvey();return;}const candidate=event.target.closest('[data-candidate]'),component=event.target.closest('[data-component]'),mapping=event.target.closest('[data-mapping]');if(candidate)selectCandidate(candidate.dataset.candidate);else if(component){selected=component.dataset.component;const c=candidates().find(c=>c.component===selected&&c.positions===$('position').value);$('candidate').value=c?.id||'';renderRoot();}else if(mapping){selectedMapping=mapping.dataset.mapping;renderTransfer();}}
$('graph').addEventListener('click',graphAction);$('graph').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){const target=event.target.closest('[data-survey-channel],[data-candidate],[data-component],[data-mapping]');if(target){event.preventDefault();graphAction(event);}}});
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));$('survey-controls').hidden=mode!=='survey';$('root-controls').hidden=mode!=='root';$('transfer-controls').hidden=mode!=='transfer';render();}));
$('survey-model').addEventListener('change',()=>{surveyLayer=Math.min(surveyLayer,surveyModel().layers-1);const p=surveyModel().points.find(p=>p.layer===surveyLayer&&Object.keys(p.doses).length>1);surveyChannel=p.channel;renderSurvey();});
$('survey-question').addEventListener('change',renderSurvey);$('survey-dose').addEventListener('change',renderSurvey);$('survey-prev').addEventListener('click',()=>changeSurveyLayer(-1));$('survey-next').addEventListener('click',()=>changeSurveyLayer(1));
$('sidebar').addEventListener('click',event=>{const button=event.target.closest('[data-answer-dose]');if(button){$('survey-dose').value=button.dataset.answerDose;renderSurvey();}});
$('expand-layers').addEventListener('change',renderRoot);
$('task').addEventListener('change',()=>{setItems();renderRoot();});$('item').addEventListener('change',renderRoot);$('position').addEventListener('change',()=>{const c=candidates().find(c=>c.component===selected&&c.positions===$('position').value);$('candidate').value=c?.id||'';renderRoot();});$('candidate').addEventListener('change',()=>selectCandidate($('candidate').value));$('group').addEventListener('change',renderTransfer);
(async()=>{try{const response=await fetch('./evidence.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);data=await response.json();const surveyResponse=await fetch('./survey-evidence.json',{cache:'no-store'});if(!surveyResponse.ok)throw new Error('调查数据 HTTP '+surveyResponse.status);surveyData=await surveyResponse.json();initSurvey();if(data.metadata?.schema_version!==1)throw new Error('证据格式不匹配');$('candidate').innerHTML='<option value="">点击图中组件</option>'+candidates().map(c=>`<option value="${c.id}">${c.id} · ${c.component} · ${c.positions==='prompt_last'?'提示末位':'答案尾部'}</option>`).join('');$('candidate').value='C01';setItems();render();$('loading').hidden=true;$('workspace').hidden=false;$('build').textContent='全层调查：880点 · 五档：88点 · 全部9880份唯一回答 · 本地只读';}catch(error){$('loading').textContent='无法读取既有证据：'+error.message+'。请通过本地只读服务打开此页。';}})();
</script>
